services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: games_center
      POSTGRES_PASSWORD: games_center_dev
      POSTGRES_DB: games_center
    ports:
      # Host port 5433 (not the default 5432) — avoids clashing with another
      # project's Postgres container also bound to 5432 on this machine. The
      # container's own internal port stays 5432, only the host mapping changed.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
